[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "groovemap-database-schema"
version = "0.6.0"
description = "Runnable Neo4j and PostgreSQL schema initializer for GrooveMap"
authors = [{name = "Robert Wlodarczyk", email = "robert@simplicityguy.com"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "groovemap-runtime[neo4j,otel,postgres]==0.1.0",
    "psycopg[binary]>=3.3.5",
]

[project.scripts]
database-schema = "groovemap_schema.initializer:cli"

[project.urls]
Homepage = "https://groovemap.music"
Repository = "https://github.com/groovemap-music/database-schema"
Issues = "https://github.com/groovemap-music/database-schema/issues"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "commitizen>=4.19.2",
    "cyclonedx-bom>=7.5.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/groovemap_schema"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "groovemap_schema/contracts"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
exclude-newer = "7 days"
# Security exception: certifi 2026.10.19 fixes PYSEC-2026-4320 and is inside the
# 7-day window. Remove after 2026-10-27T02:24:17Z, when the window covers it.
exclude-newer-package = { certifi = "2026-10-20T02:24:17Z" }

[tool.uv.sources]
groovemap-runtime = { git = "https://github.com/groovemap-music/python-libraries.git", rev = "6d0425f908e01a446b040e2993045e2afe30460e" }

[tool.ruff]
line-length = 150
target-version = "py314"

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PLC", "PTH", "RUF", "S", "SIM", "T20", "TCH", "UP", "W"]
ignore = ["B008", "C901", "E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["groovemap_schema"]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = ["PLC", "S105", "T201"]
"scripts/*.py" = ["S108", "T201"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
packages = ["groovemap_schema"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"
markers = [
    "benchmark: performance regression benchmarks",
    "e2e: end-to-end tests requiring external services",
    "integration: tests requiring a live backing service",
]

[tool.coverage.run]
source = ["groovemap_schema"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
version_scheme = "pep440"
major_version_zero = true
version_files = ["src/groovemap_schema/__init__.py"]
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
