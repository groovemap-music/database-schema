name: Publish image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: groovemap-music/automation/.github/workflows/reusable-release.yml@2f34a4da5c552bc23c75edd3d8d81be0a4b3271c
    with:
      repository-name: database-schema
      setup-command: just setup
      check-command: just check
      release-command: just release-dry-run
      artifact-path: |
        dist/*.whl
        dist/*.tar.gz
      publish-image: true
      build-context: .
      dockerfile: Dockerfile
      prepare-image-command: just prepare-runtime-wheel
      requires-private-library: true
      private-library-client-id: ${{ vars.GROOVEMAP_CI_APP_CLIENT_ID }}
      private-library-revision: 28fa329702bc76896cc54ab8d05ec5b1bd3d929e
    secrets:
      PRIVATE_LIBRARY_PRIVATE_KEY: ${{ secrets.GROOVEMAP_CI_APP_PRIVATE_KEY }}
